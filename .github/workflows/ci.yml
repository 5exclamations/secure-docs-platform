name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations scripts
      - run: ruff format --check app tests migrations scripts
      - run: mypy

  unit:
    name: Unit tests (no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not integration" --no-cov

  integration:
    name: Integration tests (PostgreSQL 16, Redis 7, S3 via moto)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: docs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_OWNER_URL: postgresql+asyncpg://postgres:ci-owner-password@localhost:5432/docs
      TEST_DATABASE_APP_URL: postgresql+asyncpg://docs_app:ci-app-password@localhost:5432/docs
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create the unprivileged runtime role
        run: |
          PGPASSWORD=ci-owner-password psql -h localhost -U postgres -d docs -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE docs_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS"
      - name: Tests with coverage gate (80%)
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-minio:
    name: Integration tests against a real MinIO (presigned URL expiry and signatures)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: docs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
      TEST_S3: minio
      TEST_DATABASE_OWNER_URL: postgresql+asyncpg://postgres:ci-owner-password@localhost:5432/docs
      TEST_DATABASE_APP_URL: postgresql+asyncpg://docs_app:ci-app-password@localhost:5432/docs
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Cache MinIO binary
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-${{ env.MINIO_VERSION }}
      - name: Build MinIO (the project no longer publishes container images)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio-bin" go install github.com/minio/minio@${{ env.MINIO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create the unprivileged runtime role
        run: |
          PGPASSWORD=ci-owner-password psql -h localhost -U postgres -d docs -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE docs_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS"
      - run: MINIO_BIN="$HOME/minio-bin/minio" pytest --no-cov

  docker:
    name: Build image and scan it
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: secure-docs-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: secure-docs-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Verify the image runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id secure-docs-api:${{ github.sha }} -u)"
          test "$uid" != "0" && echo "runs as uid $uid"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (main only, after every gate above passed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag secure-docs-api:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

  compose-smoke:
    name: End-to-end smoke test with docker compose
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1
      - run: ./scripts/gen_env.sh
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Readiness
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health/ready
      - name: Demo walkthrough (also asserts tenant isolation and share links)
        run: python scripts/demo.py --base-url http://localhost:8000
      - name: Presigned URL expiry is enforced by the object store
        run: python scripts/check_presign_expiry.py --base-url http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
