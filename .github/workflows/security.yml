name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: new CVEs appear without code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-and-deps:
    name: Bandit, pip-audit, Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Bandit (static analysis)
        run: bandit -q -r app scripts -c pyproject.toml --severity-level medium
      - name: pip-audit (known vulnerable dependencies)
        run: pip-audit -r requirements.txt --strict
      - name: Semgrep (OWASP Top 10 rules)
        run: |
          pipx run semgrep scan --error --metrics=off --config p/python --config p/owasp-top-ten --config p/jwt app

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the history being merged (pinned container image)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts=HEAD --redact --verbose --exit-code 1

  trivy-fs:
    name: Trivy (dependencies, Dockerfile, Terraform, compose misconfiguration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy fs (pinned container image)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/aquasecurity/trivy:0.75.0 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --skip-dirs infra/environments/dev/.terraform .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          # Results are gated here (and kept as an artifact) rather than relying on the code
          # scanning dashboard, which needs GitHub Advanced Security on private repositories.
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v6
        with:
          name: codeql-sarif
          path: codeql-results
      - name: Fail on any finding
        run: |
          n=$(jq '[.runs[].results | length] | add // 0' codeql-results/python.sarif)
          echo "CodeQL findings: $n"
          test "$n" -eq 0
